<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trist harness</title>
<link rel="stylesheet" href="../../shared/shadow.css">
<style>
  html,body{margin:0;background:var(--sh-cut);color:var(--sh-paper);font-family:var(--sh-serif)}
  main{display:flex;flex-direction:column;align-items:center;gap:8px;padding:8px 16px}
  .box{position:relative;width:min(calc(100vw - 32px),calc((100vh - 64px) * 1.5));aspect-ratio:3/2}
  .stage{position:absolute;inset:0;container-type:inline-size;background:var(--sh-cut)}
  .bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;font-size:15px;color:var(--sh-lamp)}
  .bar button{font:inherit;color:var(--sh-lamp);background:none;border:1px solid rgba(247,216,148,.4);padding:2px 10px;cursor:pointer}
  #out{color:var(--sh-paper)}
</style>
</head>
<body>
<main>
  <div class="box">
    <div class="stage" id="stage"></div>
  </div>
  <div class="bar">
    <button id="again" type="button">Mount again</button>
    <label><input type="checkbox" id="rm"> reduced motion</label>
    <span id="out">playing…</span>
  </div>
</main>
<script type="module">
  import game from './game.js';
  const stage = document.getElementById('stage'), out = document.getElementById('out');
  const rm = document.getElementById('rm');
  rm.checked = matchMedia('(prefers-reduced-motion: reduce)').matches || /[?&]rm=1/.test(location.search);
  let cleanup = null;
  window.tristLog = [];
  function start() {
    if (cleanup) cleanup();
    stage.replaceChildren();
    const flags = {};
    let calls = 0;
    out.textContent = 'playing…';
    const api = {
      state: Object.freeze({}),
      reducedMotion: rm.checked,
      setFlag(k, v) { flags[k] = v; window.tristLog.push(['setFlag', k, v]); },
      done(r) {
        calls++;
        window.tristLog.push(['done', r, calls]);
        console.log('trist done', r, flags, 'calls:', calls);
        out.textContent = `done ×${calls} · ${JSON.stringify(r.score)} · “${r.note}” · flags ${JSON.stringify(flags)}`;
      },
    };
    cleanup = game.mount(stage, api);
  }
  document.getElementById('again').onclick = start;
  rm.onchange = start;
  start();
</script>
</body>
</html>
