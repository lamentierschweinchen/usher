<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio · Hush (dev harness)</title>
<style>
@font-face{font-family:'IM Fell English';src:url('../../fonts/im-fell-normal.woff2') format('woff2');font-style:normal;font-display:swap}
@font-face{font-family:'IM Fell English';src:url('../../fonts/im-fell-italic.woff2') format('woff2');font-style:italic;font-display:swap}
:root{--paper:#f2eee5;--ink:#29272a;--muted:#625d5a;--rule:#cbc3b8;--red:#7a3939;--serif:'IM Fell English',Georgia,serif}
*{box-sizing:border-box}
html,body{margin:0;background:#e6e1d7;color:var(--ink);font-family:var(--serif)}
main{padding:12px 16px 24px;max-width:1200px;margin:0 auto}
.wrap{position:relative;width:min(100%, calc((100vh - 120px) * 1.5));aspect-ratio:3/2;margin:0 auto}
#stage{position:absolute;inset:0;background:var(--paper)}
.frame{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.frame rect{fill:none;stroke:var(--ink)}
.bar{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;justify-content:center;margin:10px 0 6px;font-size:15px;color:var(--muted)}
.bar button{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--rule);padding:4px 12px;cursor:pointer}
.bar label{display:flex;gap:6px;align-items:center}
#out{max-width:960px;margin:6px auto 0;font:13px/1.45 ui-monospace,Menlo,monospace;white-space:pre-wrap;color:var(--ink);background:var(--paper);border:1px solid var(--rule);padding:8px 10px;min-height:3em}
</style>
</head>
<body>
<main>
  <div class="wrap">
    <div id="stage"></div>
    <svg class="frame" viewBox="0 0 960 640" preserveAspectRatio="none" aria-hidden="true">
      <rect x="8" y="8" width="944" height="624" style="stroke-width:1.5"/>
      <rect x="14" y="14" width="932" height="612" style="stroke-width:.6"/>
    </svg>
  </div>
  <div class="bar">
    <button id="restart">Restart</button>
    <label><input type="checkbox" id="rm"> reduced motion</label>
    <label>speed <select id="speed"><option>1</option><option>2</option><option>4</option><option>8</option></select></label>
  </div>
  <pre id="out">Playing. api.done has not fired.</pre>
</main>
<script type="module">
import game from './game.js';

const q = new URLSearchParams(location.search);

// ?drive=1 swaps in a manual clock for automated testing: window.__advance(seconds) steps the game at 60fps.
if (q.has('drive')) {
  let now = 0, id = 0, queue = new Map();
  window.requestAnimationFrame = cb => { queue.set(++id, cb); return id; };
  window.cancelAnimationFrame = n => { queue.delete(n); };
  window.__advance = (sec, step = 1 / 60) => {
    for (let t = 0; t < sec - 1e-9; t += step) {
      now += step * 1000;
      const cbs = [...queue.values()]; queue = new Map();
      cbs.forEach(cb => cb(now));
    }
    return now / 1000;
  };
}
const stage = document.getElementById('stage');
const out = document.getElementById('out');
const rmBox = document.getElementById('rm');
const speedSel = document.getElementById('speed');
rmBox.checked = q.has('rm') ? q.get('rm') !== '0' : matchMedia('(prefers-reduced-motion: reduce)').matches;
speedSel.value = q.get('speed') || '1';

let cleanup = null;
function start() {
  if (cleanup) cleanup();
  stage.replaceChildren();
  const flags = {};
  let doneCount = 0;
  const show = (extra) => {
    out.textContent = `${game.title} (${game.id})\nflags: ${JSON.stringify(flags)}\ndone fired: ${doneCount}×` + (extra ? `\n${extra}` : '');
  };
  const api = {
    state: {},
    reducedMotion: rmBox.checked,
    speed: Number(speedSel.value),
    setFlag(k, v) { flags[k] = v; show(window.__studioResult ? JSON.stringify(window.__studioResult, null, 2) : ''); },
    done(result) {
      doneCount++;
      window.__studioResult = result;
      window.__studioDone = doneCount;
      console.log('[studio] done', result);
      show(JSON.stringify(result, null, 2));
    },
  };
  window.__studioResult = null; window.__studioDone = 0; window.__studioFlags = flags;
  show();
  cleanup = game.mount(stage, api);
}
document.getElementById('restart').onclick = start;
rmBox.onchange = start;
speedSel.onchange = start;
start();
</script>
</body>
</html>
