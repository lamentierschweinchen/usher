<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio · mirror input self-test</title>
<link rel="stylesheet" href="../../shared/shadow.css">
<style>
html,body{margin:0;background:#e7dcc4;color:#0b0809;font:14px/1.5 ui-monospace,Menlo,monospace}
.wrap{position:relative;width:min(100%,720px);aspect-ratio:3/2;margin:12px auto;background:#0b0809}
#stage{position:absolute;inset:0}
#out{max-width:720px;margin:0 auto;white-space:pre-wrap}
</style>
</head>
<body>
<div class="wrap"><div id="stage"></div></div>
<pre id="out">running…</pre>
<script type="module">
// Regression for work/audio/LIFECYCLE-REVIEW.md, finding 5: in the mirror studio's turn, a pointercancel
// abandons a charged hold (no KNOCK), while a real pointerup on beat three still launches one.
// Drives the game on a manual clock with synthetic pointers (so no audio starts). Result: window.__selftest.
let now = 0, id = 0, queue = new Map();
window.requestAnimationFrame = cb => { queue.set(++id, cb); return id; };
window.cancelAnimationFrame = n => { queue.delete(n); };
const step = () => { now += 1000 / 60; const cbs = [...queue.values()]; queue = new Map(); cbs.forEach(cb => cb(now)); };

const { default: game } = await import('./game.js');
const BEAT = 60 / 86, BAR = 3 * BEAT;
const onBeat3 = t => { const k = Math.round((t - 2 * BEAT) / BAR); return Math.abs(t - (2 * BEAT + k * BAR)) <= 0.2; };
const out = document.getElementById('out'), results = [];
const check = (name, ok, detail = '') => { results.push({ name, ok, detail }); };

const stage = document.getElementById('stage');
const cleanup = game.mount(stage, { mode: 'burial', state: {}, reducedMotion: false, speed: 1, ghost: null,
  setFlag() {}, rewrite() {}, done() {} });
const root = stage.querySelector('.g-mirror'), svg = root.querySelector('svg'), M = () => root.__mirror();

for (let i = 0; i < 200 && !M().ready; i++) { step(); await new Promise(r => setTimeout(r, 10)); }
check('the ghost loads', M().ready);
const until = (pred, max = 60 * 60) => { for (let i = 0; i < max && !pred(); i++) step(); return pred(); };
until(() => M().T >= 111, 60 * 120);

function pointer(type, board) {
  const p = new DOMPoint(board * 120 + 60, 420).matrixTransform(svg.getScreenCTM());
  svg.dispatchEvent(new PointerEvent(type, { pointerId: 7, pointerType: 'touch', clientX: p.x, clientY: p.y, button: 0, bubbles: true, cancelable: true }));
}
function chargeOnBeat3(board) {           // press, then hold until charged and inside beat three's window
  for (let tries = 0; tries < 40 && !M().hold; tries++) { pointer('pointerdown', board); if (!M().hold) for (let i = 0; i < 20; i++) step(); }
  if (!M().hold) return false;
  return until(() => M().hold && M().hold.charged && onBeat3(M().T), 60 * 8);
}

// 1. a cancelled hold, charged and on beat three, must not knock
const armed1 = chargeOnBeat3(3);
check('a hold charges in the turn', armed1, `T=${M().T.toFixed(2)}`);
pointer('pointercancel', 3);
check('pointercancel clears the hold', M().hold === null);
for (let i = 0; i < 60 * 4; i++) step();
check('a cancelled hold never knocks', M().knock === 'none' && !M().ending, `knock=${M().knock}`);

// 2. the positive control: a real release on beat three launches the KNOCK
const armed2 = chargeOnBeat3(5);
check('the knock is still available after a cancel', armed2, `T=${M().T.toFixed(2)}`);
pointer('pointerup', 5);
until(() => M().knock !== 'none', 60 * 5);
check('a release on beat three knocks', M().knock === 'heard' || M().knock === 'hushed', `knock=${M().knock}`);

cleanup();
const pass = results.every(r => r.ok);
window.__selftest = { pass, results };
out.textContent = (pass ? 'PASS' : 'FAIL') + '\n' + results.map(r => `${r.ok ? '✔' : '✖'} ${r.name}${r.detail ? '  (' + r.detail + ')' : ''}`).join('\n');
console.log('[selftest]', pass ? 'PASS' : 'FAIL', results);
</script>
</body>
</html>
