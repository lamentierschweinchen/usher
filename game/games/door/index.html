<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Door · dev harness</title>
<link rel="stylesheet" href="../../shared/shadow.css">
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#1a1420;color:var(--sh-paper);font-family:var(--sh-serif)}
body{padding:16px}
.box{position:relative;width:min(100%, calc((100svh - 170px) * 1.5));aspect-ratio:3/2;margin:0 auto;container-type:inline-size;
 background:var(--sh-cut);box-shadow:0 18px 40px -22px rgba(0,0,0,.8)}
.stage{position:absolute;inset:0;overflow:hidden}
.bar{max-width:960px;margin:12px auto 0;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;font-size:15px;color:var(--sh-lilac)}
.bar button{font:inherit;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--sh-lamp);background:var(--sh-cut);border:1px solid rgba(247,216,148,.35);padding:6px 14px;cursor:pointer}
.bar label{display:flex;gap:6px;align-items:center;cursor:pointer}
pre{max-width:960px;margin:10px auto;white-space:pre-wrap;font:13px/1.45 ui-monospace,Menlo,monospace;color:var(--sh-paper)}
</style>
</head>
<body>
<div class="box">
  <div class="stage" id="stage"></div>
</div>
<div class="bar">
  <button id="again" type="button">Again</button>
  <label><input id="rm" type="checkbox"> reduced motion</label>
  <span>II. A Mere Different Arrangement · dev harness</span>
</div>
<pre id="out"></pre>
<script type="module">
import game from './game.js';
const stage = document.getElementById('stage'), out = document.getElementById('out'), rm = document.getElementById('rm');
rm.checked = new URLSearchParams(location.search).has('reduced') || matchMedia('(prefers-reduced-motion: reduce)').matches;
let cleanup = null;
function start() {
  if (cleanup) cleanup();
  stage.replaceChildren();
  const log = [], flags = {}, t0 = performance.now();
  let doneCount = 0;
  const stamp = () => ((performance.now() - t0) / 1000).toFixed(1) + 's';
  const show = () => { out.textContent = log.join('\n') || 'Playing…'; };
  const api = {
    state: {},
    reducedMotion: rm.checked,
    setFlag(k, v) { flags[k] = v; log.push(`${stamp()}  setFlag ${k} = ${JSON.stringify(v)}`); show(); },
    done(result) {
      doneCount++;
      if (doneCount > 1) console.error('door: api.done called more than once');
      log.push(`${stamp()}  done #${doneCount}\n${JSON.stringify(result, null, 2)}`); show();
    },
  };
  window.__door = { api, flags, get doneCount() { return doneCount; } };
  show();
  cleanup = game.mount(stage, api);
}
document.getElementById('again').addEventListener('click', start);
rm.addEventListener('change', start);
start();
</script>
</body>
</html>
