<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tarn · dev harness</title>
<link rel="stylesheet" href="../../shared/shadow.css">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;background:#16111c;color:var(--sh-paper);font-family:var(--sh-serif)}
  main{padding:16px}
  .stage{position:relative;width:min(100%,calc((100vh - 150px) * 1.5));aspect-ratio:3/2;margin:0 auto;background:var(--sh-cut)}
  .frame{position:absolute;inset:0;pointer-events:none;outline:1px solid rgba(247,216,148,.25)}
  .bar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:center;margin:12px auto 0;font-size:16px}
  button{font:inherit;font-size:13px;letter-spacing:.16em;text-transform:uppercase;padding:8px 16px;background:var(--sh-cut);color:var(--sh-lamp);border:1px solid rgba(247,216,148,.4);cursor:pointer}
  #log{max-width:900px;margin:10px auto 0;font:13px/1.45 ui-monospace,Menlo,monospace;white-space:pre-wrap;color:#a99c8e}
  #result{font-style:italic}
</style>
</head>
<body>
<main>
  <div class="stage" id="stage"></div>
  <div class="bar">
    <button id="restart" type="button">Restart</button>
    <label><input type="checkbox" id="rm"> reduced motion</label>
    <span id="result">playing</span>
  </div>
  <pre id="log"></pre>
</main>
<script type="module">
  import game from './game.js';
  const stageEl = document.getElementById('stage');
  const logEl = document.getElementById('log');
  const resultEl = document.getElementById('result');
  const rmEl = document.getElementById('rm');
  const q = new URLSearchParams(location.search);
  rmEl.checked = q.has('rm') ? q.get('rm') !== '0' : matchMedia('(prefers-reduced-motion: reduce)').matches;

  let cleanup = null;
  const log = s => { logEl.textContent += s + '\n'; };
  // Exposed for automated checks in the harness only.
  window.__tarn = { flags: {}, done: [] };

  function start() {
    if (cleanup) cleanup();
    stageEl.replaceChildren();
    logEl.textContent = '';
    resultEl.textContent = 'playing';
    window.__tarn = { flags: {}, done: [] };
    const frame = document.createElement('div'); frame.className = 'frame';
    const api = {
      state: {},
      reducedMotion: rmEl.checked,
      setFlag(k, v) { window.__tarn.flags[k] = v; log(`setFlag(${JSON.stringify(k)}, ${JSON.stringify(v)})`); },
      done(result) {
        window.__tarn.done.push(result);
        const n = window.__tarn.done.length;
        log(`done #${n}: ${JSON.stringify(result)}`);
        resultEl.textContent = n === 1 ? `done: ${result.note}` : `ERROR: done called ${n} times`;
      },
    };
    log(`mount ${game.id} · "${game.title}" · reducedMotion=${api.reducedMotion}`);
    cleanup = game.mount(stageEl, api);
    stageEl.appendChild(frame);
  }
  document.getElementById('restart').addEventListener('click', start);
  rmEl.addEventListener('change', start);
  start();
</script>
</body>
</html>
