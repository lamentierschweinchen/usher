<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nights · dev harness</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../../shared/shadow.css">
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#e7dcc4;color:var(--sh-cut);font-family:var(--sh-serif)}
.wrap{max-width:1120px;margin:0 auto;padding:16px}
.stage{position:relative;width:min(100%,calc((100svh - 16px) * 1.5));margin:0 auto;aspect-ratio:3/2;overflow:hidden;
  background:var(--sh-cut);box-shadow:0 1px 0 rgba(255,255,255,.4),0 18px 40px -22px rgba(30,15,20,.55)}
.bar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;margin:12px 0;font-size:15px;color:#4a3d38}
.bar b{font-weight:normal;letter-spacing:.16em;text-transform:uppercase;font-size:12px;color:var(--sh-cut)}
.bar a,.bar button{font:inherit;color:var(--sh-cut);background:none;border:0;border-bottom:1px solid rgba(11,8,9,.35);padding:0;cursor:pointer;text-decoration:none}
pre{white-space:pre-wrap;font:13px/1.45 ui-monospace,Menlo,monospace;color:var(--sh-cut);border-top:1px solid rgba(11,8,9,.3);padding-top:8px;min-height:3em}
@media (max-width:600px){.wrap{padding:8px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="stage sh-grain" id="stage"></div>
  <div class="bar">
    <b>Nights · harness</b>
    <button id="restart">restart</button>
    <a href="?">night 1</a><a href="?night=2">night 2</a><a href="?night=3">night 3</a>
    <a href="?rm=1">reduced motion</a>
    <span>keys: 1–4 lift · enter stamp · a aside</span>
  </div>
  <pre id="out"></pre>
</div>
<script type="module">
import game from './game.js';
const stage = document.getElementById('stage');
const out = document.getElementById('out');
const q = new URLSearchParams(location.search);
let cleanup = null;
const log = s => { out.textContent += s + '\n'; };

function start() {
  if (cleanup) cleanup();
  stage.innerHTML = '';
  out.textContent = '';
  const flags = {};
  let doneCount = 0;
  const api = {
    state: Object.freeze({}),
    reducedMotion: q.has('rm') ? q.get('rm') !== '0' : matchMedia('(prefers-reduced-motion: reduce)').matches,
    setFlag(k, v) { flags[k] = v; log(`setFlag ${k} = ${JSON.stringify(v)}`); },
    done(result) {
      doneCount += 1;
      log(`done #${doneCount} ${JSON.stringify(result)}`);
      window.__nights = { result, doneCount, flags: { ...flags } };
    },
    dev: { startNight: +q.get('night') || 1 },
  };
  window.__nights = { result: null, doneCount: 0, flags };
  log(`mounted ${game.id} · reducedMotion ${api.reducedMotion}`);
  cleanup = game.mount(stage, api);
}
document.getElementById('restart').addEventListener('click', e => { e.currentTarget.blur(); start(); });
start();
</script>
</body>
</html>
